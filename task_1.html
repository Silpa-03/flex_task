<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>css_task</title>
        <style>
            *{
                box-sizing:border-box
            }
            .container{
                display:flex;
                background-color:blue;
                height:310px;
                width:600px;
                gap:20px;
                padding:20px;
                border:5px solid black;
            }
            .box{
                background-color:#f1f1f1;
                border:1px solid black;
                padding:20px;
                flex:1;
            }
            .left,
            .right{
                display :flex;
                flex-direction:column;
                flex:1;
                gap:20px;
            }
            .middle{
                flex:2;
                display:flex;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="left">
                <div class="box">1.1</div>
                <div class="box">2.1</div>
            </div>
            <div class="middle">
                <div class="box">1.2</div>
            </div>
            <div class="right">
                <div class="box">1.3</div>
                <div class="box">2.2</div>
            </div>
        </div>
    </body>
